# cbindgen configuration for mekong_safety FFI header generation
# Generates include/mekong_safety.h for Go cgo

language = "C"

header = """
// Copyright 2026 Mekong IDE Authors — Apache-2.0
// AUTO-GENERATED by cbindgen — DO NOT EDIT MANUALLY
// Source: rust_safety/src/lib.rs
"""

include_guard = "MEKONG_SAFETY_H"
tab_width = 4

[export]
include = [
    "msf_init",
    "msf_record_equity",
    "msf_check_drawdown",
    "msf_trigger_kill",
    "msf_is_killed",
    "msf_free",
]
