[package]
name = "mekong_safety"
version = "0.1.0"
edition = "2021"
description = "Mekong IDE safety library — drawdown monitor + kill-switch via FFI"
license = "Apache-2.0"

[lib]
name = "mekong_safety"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# MIT/Apache-2.0 licensed only — clean IP
once_cell = "1.19"          # MIT OR Apache-2.0

[build-dependencies]
# MPL-2.0 — build-time only tool, NOT linked into dylib. See README LICENSE NOTES.
cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
