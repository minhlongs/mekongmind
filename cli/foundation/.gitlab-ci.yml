# GitLab CI/CD pipeline for mekong-foundation.
# Mirrors the previous GitHub Actions ci.yml: ruff lint + format check + pytest
# across Python 3.11 / 3.12. Runs on every push to main and on merge requests.

stages:
  - lint
  - test

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
  tags: []

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:ruff-check:
  stage: lint
  script:
    - ruff check .
  interruptible: true

lint:ruff-format:
  stage: lint
  script:
    - ruff format --check .
  interruptible: true

test:py311:
  stage: test
  image: python:3.11-slim
  script:
    - pytest -q --cov=mekong_foundation --cov-report=term-missing
  interruptible: true

test:py312:
  stage: test
  image: python:3.12-slim
  script:
    - pytest -q --cov=mekong_foundation --cov-report=term-missing
  interruptible: true
