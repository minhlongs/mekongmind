name: Bug Report
description: Something is not working as documented.
title: "bug: <one-line summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please complete each section so we can
        reproduce the problem quickly.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mekong-foundation version` (or git SHA).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - low — cosmetic
        - medium — functionality impaired
        - high — data loss or crash
        - critical — security or production outage
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal commands or code snippet.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include full stack trace if any.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 14.4 / Python 3.12.2 / arm64"
    validations:
      required: true

  - type: checkboxes
    id: search
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have read SECURITY.md and confirmed this is not a security issue.
          required: true
