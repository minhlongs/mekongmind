name: Feature Request
description: Propose a new capability or enhancement.
title: "feat: <one-line summary>"
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A concrete API, command, or behavior. Pseudo-code is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why this one wins.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - small — single function or flag
        - medium — new module or command
        - large — cross-cutting change

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution intent
      options:
        - label: I am willing to send a PR if the proposal is accepted.
