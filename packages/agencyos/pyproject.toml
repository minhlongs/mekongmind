[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agencyos"
version = "0.1.0"
description = "AgencyOS (Mekong Mind) — Multi-agent Business OS with Clean Architecture. Apple Silicon M1 Max 64GB + Vertex AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "MekongMind" }]
keywords = ["agencyos", "multi-agent", "clean-architecture", "llm", "route-optimization", "vertex-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "litellm>=1.55.0",
    "tenacity>=9.0.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "cachetools>=5.5.0",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    "jsonschema>=4.23.0",
    "semver>=3.0.2",
    "rich>=13.9.0",
    "click>=8.1.7",
    "instructor>=1.6.0",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "geopy>=2.4.1",
    "ortools>=9.11.4210",
    "python-dotenv>=1.0.1",
    "sentry-sdk>=2.18.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
]
vertex = ["google-cloud-aiplatform>=1.55.0"]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.34.0"]

[project.scripts]
agencyos = "agencyos.kernel.bootstrap:_run_cli"
agencyos-cli = "adapters.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
