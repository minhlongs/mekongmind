  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # GOVERNANCE - Quadratic Voting & Proposals
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/governance/stakeholders:
    post:
      summary: Create stakeholder
      description: Tạo stakeholder với role và governance level
      operationId: createStakeholder
      tags:
        - governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - role
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [owner, admin, operator, vc_partner, founder, expert, developer, customer, community]
                email:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Stakeholder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stakeholder'

    get:
      summary: List stakeholders
      description: Danh sách stakeholders
      operationId: listStakeholders
      tags:
        - governance
      responses:
        '200':
          description: List of stakeholders
          content:
            application/json:
              schema:
                type: object
                properties:
                  stakeholders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Stakeholder'

  /v1/governance/proposals:
    post:
      summary: Create proposal
      description: |
        Tạo proposal để voting.

        ## Proposal Types
        - `feature` - Feature requests
        - `strategic` - Strategic decisions
        - `constitutional` - Constitution changes
        - `treasury` - Fund allocation
        - `equity` - Equity changes
      operationId: createProposal
      tags:
        - governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - type
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [feature, strategic, constitutional, treasury, equity]
                requested_funding:
                  type: integer
                metadata:
                  type: object
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'

    get:
      summary: List proposals
      description: Danh sách proposals với status filter
      operationId: listProposals
      tags:
        - governance
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, passed, rejected, executed]
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'

  /v1/governance/vote:
    post:
      summary: Vote on proposal
      description: |
        Cast vote với quadratic voting.

        ## Quadratic Voting
        - votes = √credits
        - Cost = votes² credits
      operationId: vote
      tags:
        - governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposal_id
                - support
                - credits
              properties:
                proposal_id:
                  type: string
                  format: uuid
                support:
                  type: boolean
                credits:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Vote cast
          content:
            application/json:
              schema:
                type: object
                properties:
                  vote_id:
                    type: string
                  votes:
                    type: number
                    description: "√credits"
                  credits_spent:
                    type: integer

  /v1/governance/reputation:
    post:
      summary: Calculate reputation
      description: Tính reputation score cho stakeholder
      operationId: calculateReputation
      tags:
        - governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stakeholder_id
              properties:
                stakeholder_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Reputation calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  stakeholder_id:
                    type: string
                  reputation_score:
                    type: number
                  level:
                    type: integer

    get:
      summary: Get reputation
      description: Lấy reputation score
      operationId: getReputation
      tags:
        - governance
      parameters:
        - name: stakeholder_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reputation score
          content:
            application/json:
              schema:
                type: object
                properties:
                  stakeholder_id:
                    type: string
                  reputation_score:
                    type: number
                  level:
                    type: integer

  /v1/governance/ngu-su:
    post:
      summary: Ngũ Sự terrain scoring
      description: |
        Ngũ Sự framework scoring - 5 yếu tố đánh giá proposal terrain.

        ## Terrain Types
        - `tan_dia` - Dispersive (người muốn về)
        - `khinh_dia` - Shallow (vào nông)
        - `tranh_dia` - Contentious (ai kiểm soát?)
        - `giao_dia` - Open (tự do qua lại)
        - `trung_dia` - Central (ngã tư)
        - `vi_dia` - Remote (xa xôi)
        - `tu_dia` - Desperate (đường cùng)
      operationId: nguSuScoring
      tags:
        - governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposal_id
              properties:
                proposal_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Ngũ Sự score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NguSuScore'

    get:
      summary: Get Ngũ Sự score
      description: Lấy Ngũ Sự score cho proposal
      operationId: getNguSu
      tags:
        - governance
      parameters:
        - name: proposal_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ngũ Sự score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NguSuScore'

  /v1/governance/treasury:
    get:
      summary: Treasury balance
      description: Current treasury balance và allocation
      operationId: getTreasury
      tags:
        - governance
      responses:
        '200':
          description: Treasury info
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_balance:
                    type: integer
                  allocated:
                    type: integer
                  available:
                    type: integer

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # LEDGER - Double-Entry Accounting
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/ledger/transfer:
    post:
      summary: Transfer between accounts
      description: |
        Double-entry transfer giữa 2 accounts.

        ## Flow
        1. Check source balance
        2. Create journal entry
        3. Debit source (-1)
        4. Credit destination (+1)
        5. Update balances
      operationId: transfer
      tags:
        - ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_code
                - to_code
                - amount
              properties:
                from_code:
                  type: string
                  maxLength: 100
                to_code:
                  type: string
                  maxLength: 100
                amount:
                  type: number
                  maximum: 1000000000
                description:
                  type: string
                  maxLength: 500
                entry_type:
                  type: string
                  maxLength: 50
                idempotency_key:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal_entry_id:
                    type: string
                    format: uuid
                  from:
                    type: string
                  to:
                    type: string
                  amount:
                    type: number
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/ledger/topup:
    post:
      summary: Add credits to account
      description: |
        Topup account từ platform treasury.

        Creates double-entry: debit platform, credit account.
      operationId: topup
      tags:
        - ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_code
                - amount
              properties:
                account_code:
                  type: string
                  maxLength: 100
                amount:
                  type: number
                  maximum: 1000000000
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Topup completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal_entry_id:
                    type: string
                  account:
                    type: string
                  credited:
                    type: number

  /v1/ledger/balance:
    get:
      summary: Account balances
      description: Lấy balance của accounts
      operationId: getBalance
      tags:
        - ledger
      parameters:
        - name: code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Account balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        code:
                          type: string
                        balance:
                          type: number

  /v1/ledger/history:
    get:
      summary: Transaction history
      description: Journal entries với transaction lines
      operationId: getHistory
      tags:
        - ledger
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        description:
                          type: string
                        entry_type:
                          type: string
                        posted_at:
                          type: string
                        lines:
                          type: string

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # EQUITY - Cap Table & SAFE
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/equity/entities:
    post:
      summary: Create equity entity
      description: Tạo entity (company, subsidiary) cho cap table
      operationId: createEntity
      tags:
        - equity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [company, subsidiary, special_class]
                total_authorized:
                  type: integer
                  default: 10000000
      responses:
        '201':
          description: Entity created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  total_authorized:
                    type: integer

    get:
      summary: List entities
      description: Danh sách equity entities
      operationId: listEntities
      tags:
        - equity
      responses:
        '200':
          description: List of entities
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                        total_authorized:
                          type: integer

  /v1/equity/grants:
    post:
      summary: Create equity grant
      description: |
        Tạo equity grant với vesting schedule.

        ## Vesting
        - cliff_months: Thời gian chờ (thường 12 tháng)
        - vesting_months: Tổng thời gian vesting (thường 48 tháng)
      operationId: createGrant
      tags:
        - equity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entity_id
                - stakeholder_id
                - shares
              properties:
                entity_id:
                  type: string
                  format: uuid
                stakeholder_id:
                  type: string
                  format: uuid
                shares:
                  type: integer
                grant_type:
                  type: string
                  enum: [iso, nso, rsa, phantom]
                cliff_months:
                  type: integer
                  default: 12
                vesting_months:
                  type: integer
                  default: 48
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  entity_id:
                    type: string
                  stakeholder_id:
                    type: string
                  shares:
                    type: integer
                  vested_shares:
                    type: integer
                  unvested_shares:
                    type: integer

  /v1/equity/cap-table/{entityId}:
    get:
      summary: Get cap table
      description: Cap table cho entity
      operationId: getCapTable
      tags:
        - equity
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cap table
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity_id:
                    type: string
                  total_shares:
                    type: integer
                  holdings:
                    type: array
                    items:
                      type: object
                      properties:
                        stakeholder_id:
                          type: string
                        shares:
                          type: integer
                        percentage:
                          type: number

  /v1/equity/safe:
    post:
      summary: Create SAFE note
      description: |
        Create SAFE (Simple Agreement for Future Equity).

        ## SAFE Terms
        - valuation_cap: Maximum valuation for conversion
        - discount_rate: Discount on next round price
        - principal_amount: Investment amount
      operationId: createSAFE
      tags:
        - equity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - investor_id
                - principal_amount
              properties:
                investor_id:
                  type: string
                  format: uuid
                principal_amount:
                  type: number
                valuation_cap:
                  type: number
                discount_rate:
                  type: number
                  maximum: 1
      responses:
        '201':
          description: SAFE created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  investor_id:
                    type: string
                  principal_amount:
                    type: number
                  valuation_cap:
                    type: number
                  discount_rate:
                    type: number

  /v1/equity/safe/{id}/convert:
    post:
      summary: Convert SAFE to equity
      description: |
        Convert SAFE note thành shares.

        ## Conversion Formula
        ```
        effectivePrice = price_per_share × (1 - discount_rate)
        shares = principal / effectivePrice

        # With valuation cap
        capShares = principal / (valuation_cap / total_authorized)
        shares = max(shares, capShares)
        ```
      operationId: convertSAFE
      tags:
        - equity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - price_per_share
                - total_authorized
              properties:
                price_per_share:
                  type: number
                total_authorized:
                  type: integer
      responses:
        '201':
          description: SAFE converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  safe_id:
                    type: string
                  shares_issued:
                    type: integer
                  conversion_price:
                    type: number

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # REVENUE - 6-Way Split
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/revenue/split:
    get:
      summary: Get revenue split config
      description: |
        Current revenue split configuration.

        ## Default Split
        - Platform: 20%
        - Expert: 30%
        - AI Compute: 15%
        - Developer: 15%
        - Community Fund: 10%
        - Customer Reward: 10%
      operationId: getRevenueSplit
      tags:
        - revenue
      responses:
        '200':
          description: Revenue split config
          content:
            application/json:
              schema:
                type: object
                properties:
                  splits:
                    type: array
                    items:
                      type: object
                      properties:
                        recipient:
                          type: string
                        percentage:
                          type: number
                        account_code:
                          type: string

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # FUNDING - Quadratic Funding
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/funding/rounds:
    post:
      summary: Create funding round
      description: Tạo quadratic funding round với matching pool
      operationId: createFundingRound
      tags:
        - funding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - matching_pool
              properties:
                name:
                  type: string
                description:
                  type: string
                matching_pool:
                  type: integer
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Round created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  matching_pool:
                    type: integer
                  status:
                    type: string
                    enum: [active, completed]

    get:
      summary: List funding rounds
      description: Danh sách funding rounds
      operationId: listFundingRounds
      tags:
        - funding
      responses:
        '200':
          description: List of rounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  rounds:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        matching_pool:
                          type: integer
                        total_contributed:
                          type: integer
                        status:
                          type: string

  /v1/funding/projects:
    post:
      summary: Add project to round
      description: Add project để nhận contributions
      operationId: addFundingProject
      tags:
        - funding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - round_id
                - name
                - description
              properties:
                round_id:
                  type: string
                  format: uuid
                name:
                  type: string
                description:
                  type: string
                target_amount:
                  type: integer
      responses:
        '201':
          description: Project added
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  round_id:
                    type: string

  /v1/funding/contribute:
    post:
      summary: Contribute to project
      description: Đóng góp vào project trong funding round
      operationId: contribute
      tags:
        - funding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - amount
              properties:
                project_id:
                  type: string
                  format: uuid
                amount:
                  type: number
                  minimum: 1
      responses:
        '201':
          description: Contribution recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  contribution_id:
                    type: string
                  project_id:
                    type: string
                  amount:
                    type: number

  /v1/funding/rounds/{id}/calculate:
    post:
      summary: Calculate QF matching
      description: |
        Tính quadratic funding matching distribution.

        ## QF Formula
        ```
        sqrtSum = Σ√ci
        directSum = Σci
        qfScore = sqrtSum² - directSum

        matched = (qfScore / totalQfScore) × matching_pool
        ```
      operationId: calculateQF
      tags:
        - funding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: QF calculation complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_id:
                    type: string
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: string
                        direct_sum:
                          type: number
                        qf_score:
                          type: number
                        matched_amount:
                          type: number

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # MATCHING - Skill/Expert Matching
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/matching/profiles:
    post:
      summary: Create skill profile
      description: Upsert skill profile cho stakeholder
      operationId: createProfile
      tags:
        - matching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stakeholder_id
              properties:
                stakeholder_id:
                  type: string
                  format: uuid
                skills:
                  type: array
                  items:
                    type: string
                industries:
                  type: array
                  items:
                    type: string
                availability:
                  type: string
                  enum: [available, busy, unavailable]
                  default: available
                hourly_rate_usd:
                  type: number
                bio:
                  type: string
      responses:
        '201':
          description: Profile created/updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  created:
                    type: boolean
                  updated:
                    type: boolean

  /v1/matching/requests:
    post:
      summary: Create match request
      description: |
        Tạo match request với auto-matching.

        ## Matching Algorithm
        - Skill overlap: 60%
        - Industry match: +10% bonus
        - Reputation score: 40%
      operationId: createMatchRequest
      tags:
        - matching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - requester_id
                - request_type
              properties:
                requester_id:
                  type: string
                  format: uuid
                request_type:
                  type: string
                  enum: [expert_needed, cofounder_needed, mentor_needed, vc_intro]
                skills_needed:
                  type: array
                  items:
                    type: string
                industry:
                  type: string
                description:
                  type: string
                budget_usd:
                  type: number
      responses:
        '201':
          description: Request created with matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  matches_found:
                    type: integer
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        match_id:
                          type: string
                        stakeholder_id:
                          type: string
                        score:
                          type: number
                        reasons:
                          type: array
                          items:
                            type: string

    get:
      summary: List match requests
      description: Danh sách match requests
      operationId: listMatchRequests
      tags:
        - matching
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, matched, closed]
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        request_type:
                          type: string
                        status:
                          type: string

  /v1/matching/matches/{id}:
    patch:
      summary: Update match status
      description: Accept or reject match
      operationId: updateMatch
      tags:
        - matching
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [accepted, rejected, completed]
      responses:
        '200':
          description: Match updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # CONFLICTS - 5-Level Resolution
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/conflicts:
    post:
      summary: Report conflict
      description: |
        Report conflict với auto-assignment resolution level.

        ## Severity → Level Mapping
        - `critical` → Level 3 (governance_review, 24h SLA)
        - `high` → Level 2 (agent_negotiation, 4h SLA)
        - `medium`/`low` → Level 1 (auto_resolve, 1h SLA)
      operationId: reportConflict
      tags:
        - conflicts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reporter_id
                - conflict_type
                - description
              properties:
                reporter_id:
                  type: string
                  format: uuid
                against_id:
                  type: string
                  format: uuid
                conflict_type:
                  type: string
                  enum: [resource, equity, decision, conduct, constitutional]
                description:
                  type: string
                  maxLength: 2000
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
      responses:
        '201':
          description: Conflict reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  severity:
                    type: string
                  resolution_level:
                    type: integer
                  resolution_name:
                    type: string
                  sla:
                    type: string
                  status:
                    type: string

    get:
      summary: List conflicts
      description: Danh sách conflicts với status filter
      operationId: listConflicts
      tags:
        - conflicts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, auto_resolved, negotiating, under_review, arbitration, constitutional_review, resolved, dismissed]
      responses:
        '200':
          description: List of conflicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        conflict_type:
                          type: string
                        status:
                          type: string
                        resolution_level:
                          type: integer
                        resolution_info:
                          type: object
                          properties:
                            name:
                              type: string
                            sla:
                              type: string
                            status:
                              type: string

  /v1/conflicts/{id}/escalate:
    post:
      summary: Escalate conflict
      description: |
        Tăng resolution level.

        ## Resolution Levels
        1. auto_resolve (1h SLA)
        2. agent_negotiation (4h SLA)
        3. governance_review (24h SLA)
        4. human_arbitration (72h SLA)
        5. constitutional_review (14d SLA)
      operationId: escalateConflict
      tags:
        - conflicts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 1000
                escalated_by:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Conflict escalated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  from_level:
                    type: integer
                  to_level:
                    type: integer
                  resolution_name:
                    type: string
                  sla:
                    type: string
                  status:
                    type: string

  /v1/conflicts/{id}/resolve:
    post:
      summary: Resolve conflict
      description: Close conflict với resolution notes
      operationId: resolveConflict
      tags:
        - conflicts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_notes:
                  type: string
                  maxLength: 2000
                dismissed:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [resolved, dismissed]
                  resolved_at:
                    type: string
                    format: date-time

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # DECENTRALIZATION - Phase Tracking
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/decentralization/status:
    get:
      summary: Get decentralization status
      description: |
        Progressive decentralization phase tracking.

        ## Phases
        1. **foundation**: 50% leadership, 25% founders, 25% community
        2. **growth**: 33% leadership, 34% founders, 33% community
        3. **maturity**: 25% leadership, 40% founders, 35% community
        4. **full_inversion**: 20% leadership, 45% founders, 35% community
      operationId: getDecentralizationStatus
      tags:
        - decentralization
      responses:
        '200':
          description: Decentralization status
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_phase:
                    type: string
                    enum: [foundation, growth, maturity, full_inversion]
                  power_distribution:
                    type: object
                    properties:
                      leadership:
                        type: number
                      founders:
                        type: number
                      community:
                        type: number
                  next_phase_requirements:
                    type: array
                    items:
                      type: string

  /v1/decentralization/check-transition:
    post:
      summary: Check phase transition
      description: Check nếu đủ điều kiện transition sang phase tiếp theo
      operationId: checkTransition
      tags:
        - decentralization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_phase:
                  type: string
                  enum: [foundation, growth, maturity, full_inversion]
      responses:
        '200':
          description: Transition check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  can_transition:
                    type: boolean
                  requirements_met:
                    type: array
                    items:
                      type: string
                  requirements_pending:
                    type: array
                    items:
                      type: string

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # RBAC - Permission Checking
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/rbac/policies:
    get:
      summary: List RBAC policies
      description: Danh sách RBAC policies
      operationId: listPolicies
      tags:
        - rbac
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        resource:
                          type: string
                        action:
                          type: string
                        required_roles:
                          type: array
                          items:
                            type: string

  /v1/rbac/check:
    post:
      summary: Check permission
      description: Check nếu stakeholder có permission
      operationId: checkPermission
      tags:
        - rbac
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stakeholder_id
                - resource
                - action
              properties:
                stakeholder_id:
                  type: string
                  format: uuid
                resource:
                  type: string
                action:
                  type: string
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key từ tenant creation hoặc billing/tenants/regenerate-key

  schemas:
    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # CORE SCHEMAS
    # ═══════════════════════════════════════════════════════════════════════════════════════════

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        goal:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, critical]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        credits_used:
          type: integer
        result:
          type: object

    Agent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        available:
          type: boolean

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        api_key_hash:
          type: string
        subscription_tier:
          type: string
          enum: [free, starter, pro, enterprise]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    PricingTier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        credits:
          type: integer
        price_usd:
          type: number
        price_vnd:
          type: integer

    CreditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        amount:
          type: integer
        type:
          type: string
          enum: [grant, usage, refund, purchase, transfer]
        description:
          type: string
        created_at:
          type: string
          format: date-time

    LLMConfig:
      type: object
      properties:
        provider:
          type: string
          enum: [openai, google, anthropic, custom]
        base_url:
          type: string
          format: uri
        model:
          type: string
        api_key_masked:
          type: string
          example: "sk-****xxxx"

    Content:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        content:
          type: string
        platform:
          type: string
          enum: [facebook, zalo, instagram, linkedin]
        status:
          type: string
          enum: [draft, scheduled, published]
        scheduled_at:
          type: string
          format: date-time

    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        external_id:
          type: string
        platform:
          type: string
        name:
          type: string
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        first_contact_at:
          type: string
          format: date-time

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        name:
          type: string
        trigger:
          type: string
        trigger_value:
          type: string
        message_template:
          type: string
        status:
          type: string
          enum: [draft, active, paused, completed]

    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # GOVERNANCE SCHEMAS
    # ═══════════════════════════════════════════════════════════════════════════════════════════

    Stakeholder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, operator, vc_partner, founder, expert, developer, customer, community]
        governance_level:
          type: integer
          minimum: 1
          maximum: 6
        reputation_score:
          type: number

    Proposal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [feature, strategic, constitutional, treasury, equity]
        status:
          type: string
          enum: [draft, active, passed, rejected, executed]
        votes_for:
          type: number
        votes_against:
          type: number
        requested_funding:
          type: integer
        created_at:
          type: string
          format: date-time

    NguSuScore:
      type: object
      properties:
        proposal_id:
          type: string
        tan_dia:
          type: number
          description: Dispersive ground score
        khinh_dia:
          type: number
          description: Shallow ground score
        tranh_dia:
          type: number
          description: Contentious ground score
        giao_dia:
          type: number
          description: Open ground score
        trung_dia:
          type: number
          description: Central ground score
        vi_dia:
          type: number
          description: Remote ground score
        tu_dia:
          type: number
          description: Desperate ground score
        overall_score:
          type: number
        terrain_type:
          type: string
          enum: [tan_dia, khinh_dia, tranh_dia, giao_dia, trung_dia, vi_dia, tu_dia]

    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # PAYMENT SCHEMAS
    # ═══════════════════════════════════════════════════════════════════════════════════════════

    ZaloMessage:
      type: object
      properties:
        event_name:
          type: string
        app_id:
          type: string
        sender:
          type: object
          properties:
            id:
              type: string
        recipient:
          type: object
          properties:
            id:
              type: string
        message:
          type: object
          properties:
            text:
              type: string
            msg_id:
              type: string
        timestamp:
          type: string

    FacebookMessage:
      type: object
      properties:
        object:
          type: string
        entry:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              messaging:
                type: array
                items:
                  type: object
                  properties:
                    sender:
                      type: object
                      properties:
                        id:
                          type: string
                    recipient:
                      type: object
                      properties:
                        id:
                          type: string
                    message:
                      type: object
                      properties:
                        mid:
                          type: string
                        text:
                          type: string
                    timestamp:
                      type: number

    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # ERROR SCHEMA
    # ═══════════════════════════════════════════════════════════════════════════════════════════

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: array
          items:
            type: object
