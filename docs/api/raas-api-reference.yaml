openapi: 3.0.3
info:
  title: RaaS (Revenue-as-a-Service) API
  description: |
    MEKONG RaaS API - AI-operated business platform với credit metering, revenue distribution, và progressive decentralization.

    ## Authentication
    Tất cả endpoints yêu cầu Bearer token API key (trừ health check và webhook endpoints).

    ## Credit System
    - 1 MCU = 1 credit unit
    - Credits được trừ trước khi thực hiện mission
    - Credits được refund khi cancel mission

    ## Governance Levels
    - Level 1-6: community → owner
    - Quadratic voting: votes = √credits
    - Quadratic funding: matched = (Σ√ci)² - Σci
  version: 5.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://agencyos.network
    description: Production
  - url: https://staging.agencyos.network
    description: Staging
  - url: http://localhost:8787
    description: Local Development

security:
  - bearerAuth: []

tags:
  - name: tasks
    description: Mission/task management with credit metering
  - name: agents
    description: Agent execution (git, file, shell, content-writer, etc.)
  - name: billing
    description: Tenant creation, API keys, Polar.sh webhooks, credits
  - name: chat
    description: Zalo OA + Facebook Messenger webhooks
  - name: content
    description: AI content generation for social media
  - name: crm
    description: Contact management and remarketing campaigns
  - name: reports
    description: Analytics and AI-generated summaries
  - name: settings
    description: LLM configuration (BYOK - Bring Your Own Key)
  - name: onboarding
    description: 4-step tenant onboarding flow
  - name: payment
    description: Vietnam payment gateways (MoMo, VNPAY)
  - name: governance
    description: Quadratic voting, proposals, reputation, Ngũ Sự scoring
  - name: ledger
    description: Double-entry ledger transfers and topups
  - name: equity
    description: Equity entities, grants, cap tables, SAFE notes
  - name: revenue
    description: 6-way revenue split distribution
  - name: funding
    description: Quadratic funding rounds with matching pool
  - name: matching
    description: Skill/expert matching system
  - name: conflicts
    description: 5-level conflict resolution with SLA
  - name: decentralization
    description: Progressive decentralization phase tracking
  - name: rbac
    description: Permission checking for stakeholders

paths:
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # HEALTH CHECK
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /health:
    get:
      summary: Health check endpoint
      description: Kiểm tra trạng thái health của API và đo database latency
      operationId: getHealth
      tags:
        - health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  database_latency_ms:
                    type: number
                    description: Database query latency in milliseconds

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # TASKS - Mission/Task Management
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/tasks:
    post:
      summary: Create new mission/task
      description: |
        Tạo mission mới với credit metering. Credits được trừ trước khi tạo mission.

        ## Credit Flow
        1. Check tenant credit balance
        2. Deduct estimated credits
        3. Create mission
        4. Refund unused credits on completion
      operationId: createTask
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - goal
              properties:
                goal:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Mission goal description
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                estimated_credits:
                  type: integer
                  minimum: 1
                  description: Estimated credit cost
                metadata:
                  type: object
                  additionalProperties: true
                  description: Additional metadata
      responses:
        '201':
          description: Mission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: List tasks
      description: Danh sách tasks với optional status filter
      operationId: listTasks
      tags:
        - tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer

  /v1/tasks/{id}:
    get:
      summary: Get task by ID
      description: Lấy chi tiết task theo ID
      operationId: getTask
      tags:
        - tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/tasks/{id}/stream:
    get:
      summary: Stream task progress (SSE)
      description: |
        Server-Sent Events stream cho real-time task progress.

        ## Event Types
        - `progress`: Cập nhật tiến độ
        - `log`: Log output
        - `complete`: Task hoàn thành
        - `error`: Lỗi xảy ra
      operationId: streamTask
      tags:
        - tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: progress
                  data: {"percent": 25, "message": "Analyzing codebase..."}

                  event: log
                  data: {"level": "info", "message": "Found 42 files"}

                  event: complete
                  data: {"status": "success", "result": {...}}

  /v1/tasks/{id}/cancel:
    post:
      summary: Cancel task
      description: Hủy task đang chạy. Unused credits được refund.
      operationId: cancelTask
      tags:
        - tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [cancelled]
                  refunded_credits:
                    type: integer
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # AGENTS - Agent Execution
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/agents:
    get:
      summary: List available agents
      description: Danh sách available agents
      operationId: listAgents
      tags:
        - agents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        available:
                          type: boolean

  /v1/agents/{name}/run:
    post:
      summary: Run agent
      description: |
        Thực thi agent với input parameters.

        ## Available Agents
        - `git` - Git operations
        - `file` - File operations
        - `shell` - Shell command execution
        - `lead-hunter` - Lead generation
        - `content-writer` - Content creation
        - `recipe-crawler` - Recipe/command crawler
      operationId: runAgent
      tags:
        - agents
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: Agent input
                options:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Agent execution started
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
                  agent:
                    type: string
                  status:
                    type: string
                    enum: [accepted, queued]
                  message:
                    type: string
                    example: "Track progress via /v1/tasks/{task_id}/stream"

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # BILLING - Tenant & Credits
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /billing/tenants:
    post:
      summary: Create tenant
      description: |
        Tạo tenant mới với API key tự động.

        ## Subscription Tiers
        - `free`: 10 credits/month
        - `starter`: 50 credits/month (199k VND)
        - `pro`: 200 credits/month (499k VND)
        - `enterprise`: 1000 credits/month (2.99M VND)
      operationId: createTenant
      tags:
        - billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                email:
                  type: string
                  format: email
                subscription_tier:
                  type: string
                  enum: [free, starter, pro, enterprise]
                  default: free
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  api_key:
                    type: string
                    description: "⚠️ Chỉ hiện lần đầu - lưu ngay!"
                  subscription_tier:
                    type: string
                  credits:
                    type: integer
                  created_at:
                    type: string
                    format: date-time

  /billing/tenants/regenerate-key:
    post:
      summary: Regenerate API key
      description: Tạo API key mới cho tenant. Key cũ bị revoke.
      operationId: regenerateApiKey
      tags:
        - billing
      responses:
        '200':
          description: API key regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: "⚠️ Chỉ hiện lần đầu - lưu ngay!"
                  revoked_at:
                    type: string
                    format: date-time

  /billing/webhook:
    post:
      summary: Polar.sh webhook
      description: |
        Polar.sh payment webhook.

        ## Events
        - `subscription.created` - New subscription
        - `subscription.updated` - Subscription changed
        - `payment.success` - Payment completed

        ## Security
        HMAC signature verification với 5-minute replay attack window
      operationId: polarWebhook
      tags:
        - billing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                event_type:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: Webhook processed
        '401':
          description: Invalid signature
        '400':
          description: Invalid payload

  /billing/pricing:
    get:
      summary: Get pricing tiers
      description: Danh sách pricing tiers
      operationId: getPricing
      tags:
        - billing
      security: []
      responses:
        '200':
          description: Pricing tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/PricingTier'

  /billing/credits:
    get:
      summary: Get credit balance
      description: Current credit balance và usage
      operationId: getCredits
      tags:
        - billing
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                  used_this_month:
                    type: integer
                  resets_at:
                    type: string
                    format: date-time

  /billing/credits/history:
    get:
      summary: Credit history
      description: Lịch sử credit transactions
      operationId: getCreditHistory
      tags:
        - billing
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Credit history
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditEntry'

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # SETTINGS - LLM Configuration (BYOK)
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/settings/llm:
    post:
      summary: Configure LLM provider
      description: |
        Cấu hình BYOK (Bring Your Own Key) LLM provider.

        ## Providers
        - `openai` - OpenAI GPT models
        - `google` - Google Gemini
        - `anthropic` - Claude models
        - `custom` - Custom OpenAI-compatible endpoint
      operationId: configureLLM
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMConfig'
      responses:
        '201':
          description: LLM configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfig'
        '400':
          description: Invalid configuration

    get:
      summary: Get LLM config
      description: Lấy cấu hình LLM hiện tại (API key masked)
      operationId: getLLM
      tags:
        - settings
      responses:
        '200':
          description: LLM configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMConfig'

    delete:
      summary: Delete LLM config
      description: Xóa cấu hình LLM, fallback về global env
      operationId: deleteLLM
      tags:
        - settings
      responses:
        '204':
          description: LLM config deleted

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # ONBOARDING - 4-Step Flow
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/onboard/status:
    get:
      summary: Get onboarding status
      description: |
        Kiểm tra tiến độ onboarding (4 steps).

        ## Steps
        1. **profile** - Business information
        2. **channel** - Connect Zalo/Facebook channel
        3. **menu** - Upload menu + auto-generate FAQ
        4. **activate** - Activate tenant
      operationId: getOnboardingStatus
      tags:
        - onboarding
      responses:
        '200':
          description: Onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed_steps:
                    type: array
                    items:
                      type: string
                      enum: [profile, channel, menu, activate]
                  current_step:
                    type: integer
                    minimum: 1
                    maximum: 4
                  ready_to_activate:
                    type: boolean

  /v1/onboard/profile:
    post:
      summary: Submit business profile
      description: Step 1 - Submit business information
      operationId: submitProfile
      tags:
        - onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - business_name
                - business_type
                - phone
              properties:
                business_name:
                  type: string
                business_type:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Profile submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  step:
                    type: integer
                    enum: [1]
                  next_step:
                    type: string
                    enum: [channel]

  /v1/onboard/channel:
    post:
      summary: Connect communication channel
      description: Step 2 - Connect Zalo OA or Facebook Page
      operationId: connectChannel
      tags:
        - onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - external_id
                - access_token
              properties:
                type:
                  type: string
                  enum: [zalo_oa, facebook_page]
                external_id:
                  type: string
                  description: Zalo OA ID or Facebook Page ID
                access_token:
                  type: string
                  description: Platform access token
      responses:
        '200':
          description: Channel connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  step:
                    type: integer
                    enum: [2]
                  next_step:
                    type: string
                    enum: [menu]

  /v1/onboard/menu:
    post:
      summary: Upload menu and generate FAQ
      description: |
        Step 3 - Upload business menu.

        LLM auto-generates FAQ knowledge base entries từ menu data.
      operationId: uploadMenu
      tags:
        - onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - menu_items
              properties:
                menu_items:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      price:
                        type: number
                      category:
                        type: string
                      description:
                        type: string
      responses:
        '200':
          description: Menu uploaded + FAQ generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  step:
                    type: integer
                    enum: [3]
                  faq_generated:
                    type: integer
                    description: Number of FAQ entries generated
                  next_step:
                    type: string
                    enum: [activate]

  /v1/onboard/activate:
    post:
      summary: Activate tenant
      description: Step 4 - Complete onboarding and activate
      operationId: activateTenant
      tags:
        - onboarding
      responses:
        '200':
          description: Tenant activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  activated_at:
                    type: string
                    format: date-time

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # CHAT - Social Webhooks
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/chat/webhook/zalo:
    post:
      summary: Zalo OA webhook
      description: |
        Nhận messages từ Zalo OA.

        ## Flow
        1. Verify HMAC signature
        2. Parse message
        3. KB lookup
        4. LLM reply
        5. Send back to user
      operationId: zaloWebhook
      tags:
        - chat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZaloMessage'
      responses:
        '200':
          description: Message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean

  /v1/chat/webhook/facebook:
    get:
      summary: Facebook webhook verification
      description: Verify token for Facebook Messenger webhook setup
      operationId: facebookWebhookVerify
      tags:
        - chat
      security: []
      parameters:
        - name: hub.mode
          in: query
          schema:
            type: string
        - name: hub.verify_token
          in: query
          schema:
            type: string
        - name: hub.challenge
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Verified
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Forbidden

    post:
      summary: Facebook Messenger webhook
      description: Nhận messages từ Facebook Messenger
      operationId: facebookWebhook
      tags:
        - chat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookMessage'
      responses:
        '200':
          description: Message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # CONTENT - AI Content Generation
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/content/generate:
    post:
      summary: Generate content batch
      description: |
        AI生成 7-14 ngày content cho social media.

        ## Content Types
        - Educational posts
        - Promotional content
        - Engagement posts
        - Story content
      operationId: generateContent
      tags:
        - content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - topic
                - days
              properties:
                topic:
                  type: string
                  description: Content topic/theme
                days:
                  type: integer
                  minimum: 7
                  maximum: 14
                  default: 7
                tone:
                  type: string
                  enum: [professional, friendly, humorous, inspirational]
      responses:
        '201':
          description: Content generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Content'
                  generated_at:
                    type: string
                    format: date-time

  /v1/content:
    get:
      summary: List content
      description: Danh sách content posts với status filter
      operationId: listContent
      tags:
        - content
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, published]
      responses:
        '200':
          description: List of content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Content'

  /v1/content/{id}:
    patch:
      summary: Update content status
      description: Cập nhật status (draft → scheduled → published)
      operationId: updateContent
      tags:
        - content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, scheduled, published]
      responses:
        '200':
          description: Content updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # CRM - Contact Management
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  /v1/crm/contacts:
    get:
      summary: List contacts
      description: Danh sách contacts
      operationId: listContacts
      tags:
        - crm
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'

    post:
      summary: Create contact
      description: Tạo contact mới
      operationId: createContact
      tags:
        - crm
      requestBody:
