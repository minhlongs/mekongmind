name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # JOB 1: MVP FULLSTACK (Next.js App Router + 197-Command Engine)
  # ------------------------------------------------------------------
  mvp-fullstack:
    name: MVP Fullstack (Next.js + CLI Execution Bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mvp/package-lock.json

      - name: Install MVP dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run 197-Command Execution Bridge & Statutory Unit Tests
        run: npm test

      - name: Build production Next.js bundle
        run: npm run build

  # ------------------------------------------------------------------
  # JOB 2: PYTHON REGISTRY & CROSS-MAPPING SUITE
  # ------------------------------------------------------------------
  registry-contracts:
    name: Registry & Cross-Mapping Suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run CLI Full Registry Cross-Mapping Verification
        run: pytest tests/test_cli_full_registry_cross_mapping.py -v --tb=short

  # ------------------------------------------------------------------
  # JOB 3: SECURITY SCAN
  # ------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets in mvp/ and apps/apex-os/
        run: |
          echo "Scanning for hardcoded secrets in mvp/src/..."
          if grep -rEn "(API_KEY|SECRET|PASSWORD)\s*=\s*['\"][^'\"]{16,}['\"]" mvp/src/ \
              --include="*.ts" --include="*.tsx" \
              | grep -v "process\.env\|test\|example" ; then
            echo "ERROR: Hardcoded secrets detected in mvp/src/"
            exit 1
          fi
          if grep -En "polar_(oat|whs)_[A-Za-z0-9]{20,}" mvp/.env.example ; then
            echo "ERROR: Non-placeholder Polar token detected in mvp/.env.example"
            exit 1
          fi
          if grep -rEn "dev-secret-change-in-production" apps/apex-os/src/ ; then
            echo "ERROR: Hardcoded Better Auth secret fallback detected in apps/apex-os/src/"
            exit 1
          fi
          echo "OK: No hardcoded secrets found"
