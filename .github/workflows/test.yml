name: Test Suite
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff
      - name: Run Python Registry Cross-Mapping Tests
        run: |
          pytest tests/test_cli_full_registry_cross_mapping.py -v --tb=short
      - name: Run MVP Fullstack Tests & Typecheck
        working-directory: mvp
        run: |
          npm ci
          npm run typecheck
          npm test
